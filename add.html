<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавить объявление — UniLost</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow p-4">
            <h2 class="mb-4">Новое объявление</h2>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Что произошло?</label>
                    <select name="status_type" class="form-select">
                        <option value="lost">Я потерял вещь</option>
                        <option value="found">Я нашел вещь</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Название вещи</label>
                    <input type="text" name="title" class="form-control" required placeholder="Например: Студенческий билет, ключи">
                </div>
                <div class="mb-3">
                    <label class="form-label">Категория</label>
                    <select name="category" class="form-select">
                        <option value="Документы">Документы</option>
                        <option value="Ключи">Ключи</option>
                        <option value="Электроника">Электроника / Телефоны</option>
                        <option value="Одежда">Одежда</option>
                        <option value="Другое">Другое</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Где потеряно / найдено (Корпус, ауд.)</label>
                    <input type="text" name="room" class="form-control" placeholder="Например: Главный корпус, ауд. 305">
                </div>
                <div class="mb-3">
                    <label class="form-label">Описание</label>
                    <textarea name="description" class="form-control" rows="3" placeholder="Опишите приметы вещи..."></textarea>
                </div>
                <button type="submit" class="btn btn-success w-100">Опубликовать</button>
                <a href="/" class="btn btn-link w-100 mt-2">Назад на главную</a>
            </form>
        </div>
    </div>
</body>
</html>
